<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #1a73e8, #42b983);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 18px;
            color: #86868b;
        }

        /* 上传区域 */
        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .upload-area {
            border: 2px dashed #d2d2d7;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: #0071e3;
            background: #f5f5f7;
        }

        .upload-icon {
            font-size: 48px;
            color: #0071e3;
            margin-bottom: 16px;
        }

        /* 文件列表 */
        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #f5f5f7;
        }

        .thumbnail-container {
            width: 60px;
            height: 60px;
            margin-right: 16px;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f7;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .file-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: #86868b;
        }

        /* 控制面板 */
        .control-panel {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .compression-rate {
            width: 100%;
            margin: 20px 0;
            -webkit-appearance: none;
            height: 4px;
            background: #d2d2d7;
            border-radius: 2px;
            outline: none;
        }

        .compression-rate::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #0071e3;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .compression-rate::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #0077ed;
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #d2d2d7;
            cursor: not-allowed;
        }

        /* 进度条 */
        .progress-bar {
            height: 4px;
            background: #f5f5f7;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-inner {
            height: 100%;
            background: #0071e3;
            width: 0;
            transition: width 0.3s ease;
        }

        /* 删除按钮样式 */
        .remove-btn {
            padding: 8px;
            color: #ff3b30;
            background: none;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .remove-btn:hover {
            background: #ffebee;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>媒体压缩工具</h1>
            <p>轻松压缩您的图片和视频，节省存储空间</p>
        </header>

        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p>点击或拖拽文件到此处上传</p>
                <p class="sub-text">支持 PNG、JPG、MP4 等格式</p>
                <input type="file" id="fileInput" style="display: none" accept="image/*,video/*" multiple>
            </div>
            <div class="file-list" id="fileList"></div>
        </section>

        <section class="control-panel">
            <label for="compressionRate">压缩率：<span id="compressionRateValue">50</span>%</label>
            <input type="range" id="compressionRate" class="compression-rate" min="1" max="100" value="50">
            <div class="button-group">
                <button id="compressAllBtn" class="btn">压缩全部</button>
                <button id="downloadAllBtn" class="btn" disabled>下载全部</button>
            </div>
        </section>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
